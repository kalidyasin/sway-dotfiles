import = [
    "~/.config/alacritty/themes/tokyonight_night.toml"
]

[font]
size = 10

[font.bold]
family = "Hack Nerd Font"
style = "Bold"

[font.bold_italic]
family = "Hack Nerd Font"
style = "Bold Italic"

[font.italic]
family = "Hack Nerd Font"
style = "Italic"

[font.normal]
family = "Hack Nerd Font"
style = "Regular"

[[keyboard.bindings]]
action = "SpawnNewInstance"
key = "Return"
mods = "Super|Shift"

[scrolling]
history = 1000
multiplier = 3

[shell]
program = "/bin/zsh"

[window]
blur = true
decorations = "None"
opacity = 0.98
title = "Alacritty"
# dynamic_title = false
padding = { x = 10, y = 5 }

[window.class]
general = "Alacritty"
instance = "Alacritty"

